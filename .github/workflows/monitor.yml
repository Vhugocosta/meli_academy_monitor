name: Monitor Mercado Ads Academy

on:
  # Runs every 5 minutes (GitHub Actions minimum for scheduled workflows).
  # NOTE: schedule may be delayed by 5-15 min during high load on GitHub side.
  schedule:
    - cron: '*/5 * * * *'
  # Allows manually triggering from the Actions tab (useful for testing).
  workflow_dispatch:

# Needed so the workflow can commit state.json back to the repo.
permissions:
  contents: write

# Prevents two runs from stepping on each other if one is slow.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Commit updated state if changed
        run: |
          if [[ -n "$(git status --porcelain state.json 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          else
            echo "No state changes to commit"
          fi
